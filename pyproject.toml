[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "espprc"
version = "0.2.0"
description = "Optimized ESPPRC solver"
requires-python = ">=3.9"
authors = [{name = "Reza Mirjalili"}]
dependencies = ["networkx>=2.5"]

[project.optional-dependencies]
test = ["numpy"]

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.packages = []
