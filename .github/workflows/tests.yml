name: Tests and source distribution
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
        openmp: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ liblemon-dev libfmt-dev libspdlog-dev
      - name: Python tools
        run: python -m pip install build Cython scikit-build-core pytest numpy networkx
      - name: Build and unpack source distribution
        run: |
          python -m build --sdist
          mkdir source-check
          tar -xzf dist/*.tar.gz -C source-check --strip-components=1
      - name: Build wheel from source archive and install
        working-directory: source-check
        run: |
          python -m pip wheel . --no-deps -w wheels \
            --config-settings=cmake.define.ESPPRC_VENDOR_DEPS=OFF \
            --config-settings=cmake.define.ESPPRC_ENABLE_OPENMP=${{ matrix.openmp }}
          python -m pip install --no-deps wheels/*.whl
      - name: Installed-wheel Python regressions
        working-directory: source-check
        run: python -m pytest -q
      - name: Native regressions
        working-directory: source-check
        run: |
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DESPPRC_VENDOR_DEPS=OFF -DESPPRC_BUILD_TESTS=ON \
            -DESPPRC_ENABLE_OPENMP=${{ matrix.openmp }}
          cmake --build build-tests --parallel 2
          ctest --test-dir build-tests --output-on-failure
      - name: Benchmark runner smoke
        working-directory: source-check
        run: python benchmarks/run.py --cases truck --repeats 1 --threads 2
